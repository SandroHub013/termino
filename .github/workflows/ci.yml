name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # jsdom 30 requires ^22.22.2 || ^24.15.0 || >=26.0.0. On Node 20 every
          # test file dies in undici with "webidl.util.markAsUncloneable is not
          # a function" before it runs. Node 20 is also EOL as of 2026-04.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # `examples/` compiles against a different JSX runtime and its own
      # tsconfig, so `npm run typecheck` never looks at it.
      - name: Typecheck examples
        run: npm run typecheck:examples

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run --coverage

      # The thresholds themselves live in vitest.config.mts and fail the step
      # above; this only puts the numbers where a reviewer can see them.
      - name: Summarise coverage
        if: always()
        run: |
          summary=coverage/coverage-summary.json
          [ -f "$summary" ] || exit 0
          {
            echo "### Coverage"
            echo
            echo "| Metric | Covered | % |"
            echo "| --- | --- | --- |"
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              for (const k of ["statements", "branches", "functions", "lines"]) {
                const m = t[k];
                console.log(`| ${k} | ${m.covered}/${m.total} | ${m.pct}% |`);
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The deploy workflow runs this only after a merge; running it here means
      # a build failure is caught on the pull request instead.
      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          retention-days: 7
