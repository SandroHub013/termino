name: Lighthouse

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: accessibility and best practices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build the static site
        run: npm run build
        env:
          CI: true

      # A production build sets `basePath: "/termino"`, so every asset is
      # requested under that prefix. Served from the root of `out/` the
      # stylesheet 404s and the audit measures an unstyled page — white
      # background, default link sizes — which fails on contrast and tap
      # targets for reasons that have nothing to do with the site.
      - name: Stage the site under its base path
        run: |
          mkdir -p site
          mv out site/termino

      # `.lighthouserc.json` serves `site/` and names the three pages to
      # audit; the runner already has python3, so nothing extra is installed
      # to serve static files.
      - name: Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
