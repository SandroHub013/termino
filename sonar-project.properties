sonar.projectKey=SandroHub013_termino
sonar.projectName=termino

sonar.sources=app,components,examples,lib,mdx-components.tsx
sonar.tests=test
sonar.sourceEncoding=UTF-8

# `npm run test:coverage` writes this.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=node_modules/**,.next/**,out/**,coverage/**,public/**

# ---------------------------------------------------------------------------
# Suppressed rules
#
# Both entries below are also encoded in `eslint.config.mjs`, so the two tools
# agree on what this repository considers a finding. Nothing else is
# suppressed: every other rule these tools raise is fixed in the code.
# ---------------------------------------------------------------------------

sonar.issue.ignore.multicriteria=openTuiProps,openTuiPropsTs,terminalGridKeys,terminalGridKeysTs

# S6747 — "JSX elements should not use unknown properties and attributes".
#
# `examples/` compiles with `jsxImportSource: "@opentui/react"` (see
# `tsconfig.examples.json`). Its intrinsic elements are terminal renderables,
# not DOM elements: `fg` and `bg` are declared props of `TextOptions`, and
# `gap`, `borderStyle` and `flexDirection` of `BoxOptions`. A check that
# validates JSX props against the HTML DOM has nothing to say about them.
sonar.issue.ignore.multicriteria.openTuiProps.ruleKey=javascript:S6747
sonar.issue.ignore.multicriteria.openTuiProps.resourceKey=examples/**/*
sonar.issue.ignore.multicriteria.openTuiPropsTs.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.openTuiPropsTs.resourceKey=examples/**/*

# S6479 — "React list components should not be keyed by item index".
#
# These eight files render a fixed terminal grid. A child's identity *is* its
# row and column: the grid never reorders, cells are not inserted or removed
# in the middle, and no other property of a cell is unique — two cells showing
# the same character in the same colour are interchangeable except for where
# they sit. The index is the stable key here rather than a stand-in for one.
sonar.issue.ignore.multicriteria.terminalGridKeys.ruleKey=javascript:S6479
sonar.issue.ignore.multicriteria.terminalGridKeys.resourceKey=**/{code-block,terminal,canvas,grid,line-chart,qrcode,sparkline,textarea}.tsx
sonar.issue.ignore.multicriteria.terminalGridKeysTs.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.terminalGridKeysTs.resourceKey=**/{code-block,terminal,canvas,grid,line-chart,qrcode,sparkline,textarea}.tsx
